# Production routing sketch. Adjust server_name and TLS in the deployment step.
server { listen 80; server_name vedaneri.org www.vedaneri.org;       location / { proxy_pass http://web:3000; } }
server { listen 80; server_name admin.vedaneri.org;                  location / { proxy_pass http://cms:3001; } }
server { listen 80; server_name api.vedaneri.org;                    location / { proxy_pass http://api:4000; } }
